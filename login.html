---
layout: auth
title: Iniciar sesión
custom_js: "/assets/js/login.js"
---
<div class="text-center mb-6">
  <i class="fas fa-utensils text-5xl text-purple-500"></i>
  <h1 class="text-2xl font-bold text-gray-800 mt-2">Restaurante Delicias</h1>
  <p class="text-muted">Inicia sesión para gestionar</p>
</div>

<form id="loginForm">
  <div class="mb-4">
    <label class="block text-sm font-medium text-gray-700 mb-1">Email</label>
    <input type="email" id="email" class="input" placeholder="tu@email.com" required />
  </div>
  <div class="mb-6">
    <label class="block text-sm font-medium text-gray-700 mb-1">Contraseña</label>
    <input type="password" id="password" class="input" placeholder="••••••••" required />
  </div>
  <button type="submit" class="btn btn-primary w-full"><i class="fas fa-sign-in-alt mr-2"></i> Ingresar</button>
</form>

<p class="text-center text-sm text-muted mt-4">
  ¿No tienes cuenta? <a href="{{ '/register.html' | relative_url }}" class="text-purple-600 font-semibold">Regístrate aquí</a>
</p>
<div id="loginError" class="text-red-500 text-sm text-center mt-2 hidden"></div>

<!DOCTYPE html>
<html lang="es">
<head>
  {% include head.html %}
  <style>
    body {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      background: linear-gradient(135deg, #ffeaa7, #fd79a8, #a29bfe);
      padding: 1.5rem;
    }
    .auth-box {
      max-width: 400px;
      width: 100%;
    }
  </style>
</head>
<body>
  <div class="box auth-box">
    {{ content }}
  </div>

  <script src="https://cdn.jsdelivr.net/npm/pocketbase@0.21.1/dist/pocketbase.umd.js"></script>
  <script src="{{ '/assets/js/common.js' | relative_url }}"></script>
  {% if page.scripts %}
    {% for script in page.scripts %}
      <script src="{{ script | relative_url }}"></script>
    {% endfor %}
  {% endif %}
</body>
</html>

---
layout: default
title: Menús
custom_js: "/assets/js/menus.js"
onload_js: "initMenus();"
---
<div class="card mb-6">
  <h2 class="text-xl font-bold text-gray-700 mb-4"><i class="fas fa-plus-circle text-green-500 mr-2"></i>Nuevo plato</h2>
  <form id="menuForm" class="grid grid-cols-1 md:grid-cols-4 gap-3">
    <input type="hidden" id="editId" value="" />
    <div>
      <label class="block text-sm font-medium text-gray-600">Tipo</label>
      <select id="tipo" class="input">
        <option value="breakfast">Desayuno</option>
        <option value="lunch">Almuerzo</option>
        <option value="dinner">Cena</option>
      </select>
    </div>
    <div>
      <label class="block text-sm font-medium text-gray-600">Nombre</label>
      <input type="text" id="nombre" placeholder="Ej. Lomo saltado" class="input" required />
    </div>
    <div>
      <label class="block text-sm font-medium text-gray-600">Precio (S/)</label>
      <input type="number" id="precio" placeholder="7.00" step="0.01" min="0" class="input" required />
    </div>
    <div class="flex items-end gap-2">
      <button type="submit" id="submitBtn" class="btn btn-success w-full"><i class="fas fa-save"></i> Guardar</button>
      <button type="button" id="cancelBtn" class="btn btn-danger hidden">Cancelar</button>
    </div>
  </form>
</div>

<div class="card">
  <h2 class="text-xl font-bold text-gray-700 mb-4"><i class="fas fa-list text-pink-500 mr-2"></i>Platos registrados</h2>
  <div id="menuList" class="space-y-2 max-h-96 overflow-y-auto">
    <p class="text-center text-muted">Cargando...</p>
  </div>
</div>

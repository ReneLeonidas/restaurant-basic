---
layout: auth
title: Registro
custom_js: "/assets/js/register.js"
---
<div class="text-center mb-6">
  <i class="fas fa-user-plus text-5xl text-green-500"></i>
  <h1 class="text-2xl font-bold text-gray-800 mt-2">Crear cuenta</h1>
  <p class="text-muted">Regístrate para comenzar</p>
</div>

<form id="registerForm">
  <div class="mb-4">
    <label class="block text-sm font-medium text-gray-700 mb-1">Email</label>
    <input type="email" id="email" class="input" placeholder="tu@email.com" required />
  </div>
  <div class="mb-4">
    <label class="block text-sm font-medium text-gray-700 mb-1">Contraseña</label>
    <input type="password" id="password" class="input" placeholder="Mínimo 8 caracteres" required minlength="8" />
  </div>
  <div class="mb-6">
    <label class="block text-sm font-medium text-gray-700 mb-1">Confirmar contraseña</label>
    <input type="password" id="passwordConfirm" class="input" placeholder="Repite la contraseña" required />
  </div>
  <button type="submit" class="btn btn-success w-full"><i class="fas fa-user-plus mr-2"></i> Registrarse</button>
</form>

<p class="text-center text-sm text-muted mt-4">
  ¿Ya tienes cuenta? <a href="{{ '/login.html' | relative_url }}" class="text-green-600 font-semibold">Inicia sesión</a>
</p>
<div id="registerError" class="text-red-500 text-sm text-center mt-2 hidden"></div>

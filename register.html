<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Registro de usuario</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/pocketbase@0.21.1/dist/pocketbase.umd.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
    <style>
        body {
            background: linear-gradient(135deg, #fdcb6e, #e17055);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .register-card {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(8px);
            border-radius: 2rem;
            padding: 2.5rem;
            max-width: 400px;
            width: 100%;
            box-shadow: 0 8px 32px rgba(0,0,0,0.1);
        }
        .btn-register {
            background: #00b894;
            color: white;
            border-radius: 9999px;
            padding: 0.7rem 1.5rem;
            font-weight: 600;
            transition: 0.2s;
            width: 100%;
        }
        .btn-register:hover { background: #00a381; transform: scale(1.02); }
        .input-joy {
            border-radius: 9999px;
            border: none;
            background: #f0f0f0;
            padding: 0.7rem 1.2rem;
            width: 100%;
            transition: 0.2s;
        }
        .input-joy:focus {
            outline: 2px solid #00b894;
            background: white;
        }
    </style>
</head>
<body>
    <div class="register-card">
        <div class="text-center mb-6">
            <i class="fas fa-user-plus text-5xl text-green-500"></i>
            <h1 class="text-2xl font-bold text-gray-800 mt-2">Crear cuenta</h1>
            <p class="text-gray-500">Regístrate para comenzar</p>
        </div>

        <form id="registerForm">
            <div class="mb-4">
                <label class="block text-sm font-medium text-gray-700 mb-1">Email</label>
                <input type="email" id="email" class="input-joy" placeholder="tu@email.com" required />
            </div>
            <div class="mb-4">
                <label class="block text-sm font-medium text-gray-700 mb-1">Contraseña</label>
                <input type="password" id="password" class="input-joy" placeholder="Mínimo 8 caracteres" required minlength="8" />
            </div>
            <div class="mb-6">
                <label class="block text-sm font-medium text-gray-700 mb-1">Confirmar contraseña</label>
                <input type="password" id="passwordConfirm" class="input-joy" placeholder="Repite la contraseña" required />
            </div>
            <button type="submit" class="btn-register"><i class="fas fa-user-plus mr-2"></i> Registrarse</button>
        </form>

        <p class="text-center text-sm text-gray-500 mt-4">
            ¿Ya tienes cuenta? <a href="login.html" class="text-green-600 font-semibold">Inicia sesión</a>
        </p>
        <div id="registerError" class="text-red-500 text-sm text-center mt-2 hidden"></div>
    </div>

    <script>
        const pb = new PocketBase('https://pocketbase.peruano365.org.pe'); // Cambia por tu URL

        document.getElementById('registerForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;
            const passwordConfirm = document.getElementById('passwordConfirm').value;
            const errorDiv = document.getElementById('registerError');
            errorDiv.classList.add('hidden');

            if (password !== passwordConfirm) {
                errorDiv.textContent = 'Las contraseñas no coinciden';
                errorDiv.classList.remove('hidden');
                return;
            }

            try {
                // Crear usuario en PocketBase
                await pb.collection('users').create({
                    email,
                    password,
                    passwordConfirm
                });
                // Auto-login después del registro
                await pb.collection('users').authWithPassword(email, password);
                // Redirigir al dashboard
                window.location.href = 'index.html';
            } catch (error) {
                errorDiv.textContent = error.message || 'Error al registrar';
                errorDiv.classList.remove('hidden');
            }
        });
    </script>
</body>
</html>

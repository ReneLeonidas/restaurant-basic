---
layout: default
title: Ventas
custom_js: "/assets/js/sales.js"
onload_js: "initSales();"
---
<div class="card mb-6">
  <h2 class="text-xl font-bold text-gray-700 mb-4"><i class="fas fa-plus-circle text-green-500 mr-2"></i>Nueva venta</h2>
  <form id="saleForm" class="grid grid-cols-1 md:grid-cols-4 gap-3">
    <div>
      <label class="block text-sm font-medium text-gray-600">Tipo de comida</label>
      <select id="tipoComida" class="input">
        <option value="breakfast">Desayuno</option>
        <option value="lunch">Almuerzo</option>
        <option value="dinner">Cena</option>
      </select>
    </div>
    <div>
      <label class="block text-sm font-medium text-gray-600">Menú</label>
      <select id="menuSelect" class="input" required>
        <option value="">Seleccionar</option>
      </select>
    </div>
    <div>
      <label class="block text-sm font-medium text-gray-600">Cantidad</label>
      <input type="number" id="cantidad" value="1" min="1" class="input" />
    </div>
    <div>
      <label class="block text-sm font-medium text-gray-600">Notas</label>
      <input type="text" id="notas" placeholder="Mesa, para llevar..." class="input" />
    </div>
    <div class="md:col-span-4 flex justify-between items-center">
      <div class="text-sm text-muted">
        <span>Precio unitario: <strong id="displayPrice">—</strong></span>
        <span class="ml-4">Total: <strong id="displayTotal">S/ 0.00</strong></span>
      </div>
      <button type="submit" class="btn btn-primary"><i class="fas fa-check-circle"></i> Registrar</button>
    </div>
  </form>
</div>

<div class="card">
  <div class="flex flex-wrap gap-2 mb-4">
    <button class="filter-btn active" data-filter="all">Todos</button>
    <button class="filter-btn" data-filter="breakfast">Desayuno</button>
    <button class="filter-btn" data-filter="lunch">Almuerzo</button>
    <button class="filter-btn" data-filter="dinner">Cena</button>
  </div>
  <div id="salesList" class="space-y-2 max-h-96 overflow-y-auto">
    <p class="text-center text-muted">Cargando...</p>
  </div>
</div>

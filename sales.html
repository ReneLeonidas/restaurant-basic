<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Registro de Ventas</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/pocketbase@0.21.1/dist/pocketbase.umd.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
    <style>
        body {
            background: linear-gradient(135deg, #fd79a8, #a29bfe, #fdcb6e);
            background-attachment: fixed;
            min-height: 100vh;
        }
        .card-glass {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(8px);
            border-radius: 2rem;
            padding: 1.5rem;
            box-shadow: 0 8px 32px rgba(0,0,0,0.1);
        }
        .btn-sell {
            background: #6c5ce7;
            color: white;
            border-radius: 9999px;
            padding: 0.7rem 2rem;
            font-weight: 600;
            transition: 0.2s;
        }
        .btn-sell:hover { background: #5f3dc4; transform: scale(1.02); }
        .filter-btn {
            background: white;
            border-radius: 9999px;
            padding: 0.3rem 1.2rem;
            font-weight: 500;
            border: 2px solid transparent;
            transition: 0.2s;
            cursor: pointer;
        }
        .filter-btn.active {
            border-color: #6c5ce7;
            background: #f3f0ff;
        }
        .badge-tipo {
            padding: 0.2rem 0.8rem;
            border-radius: 9999px;
            font-size: 0.75rem;
            font-weight: 600;
        }
        .badge-breakfast { background: #fdcb6e; color: #2d3436; }
        .badge-lunch { background: #55efc4; color: #2d3436; }
        .badge-dinner { background: #ff7675; color: #2d3436; }
        .user-badge {
            background: white;
            border-radius: 9999px;
            padding: 0.3rem 1.2rem;
            font-weight: 500;
            color: #2d3436;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
        }
        .logout-btn {
            background: #ff7675;
            color: white;
            border-radius: 9999px;
            padding: 0.3rem 1.2rem;
            transition: 0.2s;
            cursor: pointer;
        }
        .logout-btn:hover { background: #e74c3c; }
    </style>
</head>
<body class="p-4 md:p-8 font-sans antialiased">

    <div class="max-w-4xl mx-auto">
        <!-- Encabezado -->
        <div class="flex flex-col md:flex-row justify-between items-center mb-6">
            <h1 class="text-3xl font-extrabold text-white drop-shadow-lg flex items-center gap-3">
                <i class="fas fa-cash-register text-green-300"></i> Ventas
            </h1>
            <div class="flex items-center gap-3 mt-3 md:mt-0">
                <span class="user-badge" id="userEmail"><i class="fas fa-user-circle"></i> usuario@example.com</span>
                <span class="logout-btn" onclick="logout()"><i class="fas fa-sign-out-alt"></i> Salir</span>
            </div>
        </div>

        <!-- Navegación -->
        <div class="flex gap-3 mb-6">
            <a href="index.html" class="btn-joy bg-blue-400 hover:bg-blue-500"><i class="fas fa-chart-simple"></i> Dashboard</a>
            <a href="menus.html" class="btn-joy bg-pink-400 hover:bg-pink-500"><i class="fas fa-edit"></i> Menús</a>
        </div>

        <!-- Formulario de venta -->
        <div class="card-glass mb-6">
            <h2 class="text-xl font-bold text-gray-700 mb-4"><i class="fas fa-plus-circle text-green-500 mr-2"></i>Nueva venta</h2>
            <form id="saleForm" class="grid grid-cols-1 md:grid-cols-4 gap-3">
                <div>
                    <label class="block text-sm font-medium text-gray-600">Tipo de comida</label>
                    <select id="tipoComida" class="w-full rounded-full border-0 bg-gray-100 px-4 py-2 focus:ring-2 focus:ring-purple-400">
                        <option value="breakfast">Desayuno</option>
                        <option value="lunch">Almuerzo</option>
                        <option value="dinner">Cena</option>
                    </select>
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-600">Menú</label>
                    <select id="menuSelect" class="w-full rounded-full border-0 bg-gray-100 px-4 py-2 focus:ring-2 focus:ring-purple-400" required>
                        <option value="">Seleccionar</option>
                    </select>
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-600">Cantidad</label>
                    <input type="number" id="cantidad" value="1" min="1" class="w-full rounded-full border-0 bg-gray-100 px-4 py-2 focus:ring-2 focus:ring-purple-400" />
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-600">Notas</label>
                    <input type="text" id="notas" placeholder="Mesa, para llevar..." class="w-full rounded-full border-0 bg-gray-100 px-4 py-2 focus:ring-2 focus:ring-purple-400" />
                </div>
                <div class="md:col-span-4 flex justify-end">
                    <button type="submit" class="btn-sell"><i class="fas fa-check-circle"></i> Registrar venta</button>
                </div>
            </form>
            <div class="mt-3 text-sm text-gray-600 flex justify-between">
                <span>Precio unitario: <span id="displayPrice">—</span></span>
                <span>Total: <span id="displayTotal">S/ 0.00</span></span>
            </div>
        </div>

        <!-- Filtros y listado -->
        <div class="card-glass">
            <div class="flex flex-wrap gap-2 mb-4">
                <button class="filter-btn active" data-filter="all">Todos</button>
                <button class="filter-btn" data-filter="breakfast">Desayuno</button>
                <button class="filter-btn" data-filter="lunch">Almuerzo</button>
                <button class="filter-btn" data-filter="dinner">Cena</button>
            </div>
            <div id="salesList" class="space-y-2 max-h-96 overflow-y-auto">
                <p class="text-gray-500 text-center">Cargando...</p>
            </div>
        </div>
    </div>

    <script src="js/common.js"></script>
    <script>
        (function() {
            if (!checkAuth()) return;

            const user = getCurrentUser();
            if (user) {
                document.getElementById('userEmail').innerHTML = `<i class="fas fa-user-circle"></i> ${user.email}`;
            }

            let menus = [];
            let currentFilter = 'all';

            // Cargar menús para el select
            async function loadMenus() {
                try {
                    const result = await pb.collection('menus').getList(1, 50, { sort: 'nombre' });
                    menus = result.items;
                    populateMenuSelect();
                } catch (error) {
                    console.error(error);
                }
            }

            function populateMenuSelect() {
                const select = document.getElementById('menuSelect');
                select.innerHTML = '<option value="">Seleccionar</option>';
                menus.forEach(m => {
                    const opt = document.createElement('option');
                    opt.value = m.id;
                    opt.textContent = `${m.nombre} (${m.tipo}) - S/ ${Number(m.precio).toFixed(2)}`;
                    select.appendChild(opt);
                });
                // Actualizar precio al cambiar
                select.addEventListener('change', updatePriceAndTotal);
                document.getElementById('cantidad').addEventListener('input', updatePriceAndTotal);
                updatePriceAndTotal();
            }

            function updatePriceAndTotal() {
                const selectedId = document.getElementById('menuSelect').value;
                const qty = parseInt(document.getElementById('cantidad').value) || 0;
                const menu = menus.find(m => m.id === selectedId);
                const price = menu ? menu.precio : 0;
                document.getElementById('displayPrice').textContent = price ? `S/ ${price.toFixed(2)}` : '—';
                document.getElementById('displayTotal').textContent = `S/ ${(price * qty).toFixed(2)}`;
            }

            // Registrar venta
            document.getElementById('saleForm').addEventListener('submit', async function(e) {
                e.preventDefault();
                const tipo_comida = document.getElementById('tipoComida').value;
                const menu_id = document.getElementById('menuSelect').value;
                const cantidad = parseInt(document.getElementById('cantidad').value) || 1;
                const notas = document.getElementById('notas').value.trim();

                if (!menu_id) { alert('Selecciona un menú'); return; }

                const menu = menus.find(m => m.id === menu_id);
                if (!menu) { alert('Menú no encontrado'); return; }
                const precio_unitario = menu.precio;
                const total = cantidad * precio_unitario;
                const fecha = new Date().toISOString();

                const data = {
                    tipo_comida,
                    menu_id,
                    cantidad,
                    precio_unitario,
                    total,
                    notas,
                    fecha
                };

                try {
                    await pb.collection('sales').create(data);
                    alert('Venta registrada');
                    document.getElementById('notas').value = '';
                    document.getElementById('cantidad').value = 1;
                    loadSales(currentFilter);
                } catch (error) {
                    alert('Error: ' + error.message);
                }
            });

            // Cargar ventas con filtro
            async function loadSales(filter) {
                try {
                    const filterParam = filter !== 'all' ? `tipo_comida="${filter}"` : '';
                    const result = await pb.collection('sales').getList(1, 50, {
                        sort: '-created',
                        expand: 'menu_id',
                        filter: filterParam
                    });
                    renderSales(result.items);
                } catch (error) {
                    document.getElementById('salesList').innerHTML = `<p class="text-red-500">${error.message}</p>`;
                }
            }

            function renderSales(sales) {
                const container = document.getElementById('salesList');
                if (!sales.length) {
                    container.innerHTML = '<p class="text-gray-500 text-center">No hay ventas</p>';
                    return;
                }
                let html = '';
                sales.forEach(s => {
                    const menuName = s.expand?.menu_id?.nombre || 'Desconocido';
                    const tipoLabel = { breakfast: 'Desayuno', lunch: 'Almuerzo', dinner: 'Cena' }[s.tipo_comida] || s.tipo_comida;
                    const badge = `badge-${s.tipo_comida}`;
                    const fecha = new Date(s.fecha).toLocaleString();
                    html += `
                        <div class="flex flex-wrap justify-between items-center bg-white/70 p-3 rounded-xl shadow-sm border border-gray-100">
                            <div>
                                <span class="font-semibold text-gray-800">${menuName}</span>
                                <span class="text-sm text-gray-500 ml-2">x${s.cantidad}</span>
                                <span class="badge-tipo ${badge} ml-2">${tipoLabel}</span>
                                <div class="text-xs text-gray-400 mt-1">${fecha} ${s.notas ? '· ' + s.notas : ''}</div>
                            </div>
                            <span class="font-bold text-purple-600">S/ ${(s.total || 0).toFixed(2)}</span>
                        </div>
                    `;
                });
                container.innerHTML = html;
            }

            // Filtros
            document.querySelectorAll('.filter-btn').forEach(btn => {
                btn.addEventListener('click', function() {
                    document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
                    this.classList.add('active');
                    currentFilter = this.dataset.filter;
                    loadSales(currentFilter);
                });
            });

            // Inicializar
            loadMenus().then(() => loadSales('all'));
        })();
    </script>
</body>
</html>

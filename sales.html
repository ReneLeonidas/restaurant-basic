---
layout: default
title: Ventas
---

<div class="box">
  <h2 class="title is-5"><i class="fas fa-plus-circle has-text-success"></i> Nueva venta</h2>
  <form id="saleForm">
    <div class="field">
      <label class="label">Tipo de comida</label>
      <div class="control">
        <div class="select is-fullwidth">
          <select id="tipoComida">
            <option value="breakfast">Desayuno</option>
            <option value="lunch">Almuerzo</option>
            <option value="dinner">Cena</option>
          </select>
        </div>
      </div>
    </div>
    <div class="field">
      <label class="label">Menú</label>
      <div class="control">
        <div class="select is-fullwidth">
          <select id="menuSelect">
            <option value="">Seleccionar</option>
          </select>
        </div>
      </div>
    </div>
    <div class="field">
      <label class="label">Cantidad</label>
      <div class="control">
        <input class="input" type="number" id="cantidad" value="1" min="1" />
      </div>
    </div>
    <div class="field">
      <label class="label">Notas</label>
      <div class="control">
        <input class="input" type="text" id="notas" placeholder="Mesa, para llevar..." />
      </div>
    </div>
    <div class="field is-grouped">
      <div class="control">
        <button class="button is-primary" type="submit"><i class="fas fa-check-circle"></i> Registrar</button>
      </div>
      <div class="control">
        <span>Precio: <strong id="displayPrice">—</strong></span>
        <span class="ml-4">Total: <strong id="displayTotal">S/ 0.00</strong></span>
      </div>
    </div>
  </form>
</div>

<!-- Listado de ventas con filtros -->
<div class="box">
  <div class="buttons">
    <button class="button is-small is-primary is-outlined filter-btn" data-filter="all">Todos</button>
    <button class="button is-small filter-btn" data-filter="breakfast">Desayuno</button>
    <button class="button is-small filter-btn" data-filter="lunch">Almuerzo</button>
    <button class="button is-small filter-btn" data-filter="dinner">Cena</button>
  </div>
  <div id="salesList">
    <p class="has-text-centered has-text-grey-light">Cargando...</p>
  </div>
</div>

<script src="{{ '/assets/js/sales.js' | relative_url }}"></script>
